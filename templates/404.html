<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 - Sahifa Topilmadi | Anti-Narko</title>

<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/parliament.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
    margin: 0;
    height: 100vh;
    background: #f4f8fc;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
    font-family: 'Segoe UI', sans-serif;
    color: #1e293b;
}

/* MARKAZ */
.center-box {
    position: relative;
    text-align: center;
    z-index: 5;
}

.center-box h1 {
    font-size: 120px;
    margin: 0;
    font-weight: 800;
    color: #0ea5e9;
}

.center-box p {
    margin-top: 10px;
    color: #64748b;
}

.btn-home {
    margin-top: 20px;
    display: inline-block;
    padding: 12px 28px;
    background: #0ea5e9;
    color: white;
    text-decoration: none;
    border-radius: 6px;
    transition: 0.3s;
}

.btn-home:hover {
    background: #0284c7;
    transform: translateY(-3px);
}

/* ORBIT CONTAINER */
.orbit {
    position: absolute;
    width: 600px;
    height: 600px;
    border-radius: 50%;
    animation: rotate 25s linear infinite;
}

/* LOGO */
.logo-item {
    position: absolute;
    width: 35px;
    height: 35px;
    opacity: 0.5;
}

.logo-item img {
    width: 100%;
}

/* YAQINROQ LOGOLAR */
.logo-item.inner {
    opacity: 1;
    filter: blur(0);
}

.logo-item.outer {
    opacity: 0.4;
    filter: blur(2px);
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
</style>
</head>
<body>

<!-- Aylanadigan logolar -->
<div class="orbit">

    <!-- 8 ta joylashtirilgan logo -->
    <div class="logo-item inner" style="top:0; left:50%;">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="logo-item outer" style="top:20%; left:85%;">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="logo-item inner" style="top:50%; left:100%;">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="logo-item outer" style="top:80%; left:85%;">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="logo-item inner" style="top:100%; left:50%;">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="logo-item outer" style="top:80%; left:10%;">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="logo-item inner" style="top:50%; left:0%;">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

    <div class="logo-item outer" style="top:20%; left:10%;">
        <img src="{{ url_for('static', filename='images/logo.png') }}">
    </div>

</div>

<!-- MARKAZ -->
<div class="center-box">
    <h1>404</h1>
    <p>Sahifa topilmadi</p>
    <a href="{{ url_for('index') }}" class="btn-home">
        Bosh sahifaga qaytish
    </a>
</div>

</body>
</html>
