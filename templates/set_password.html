<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parol o'rnatish</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dark.css') }}">
    <style>
        .password-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #f5f7fa;
            padding: 1rem;
        }
        
        .password-box {
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
        }
        
        .password-logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        
        .password-logo h2 {
            color: #1e3a8a;
            margin-bottom: 0.5rem;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }
        
        .form-control {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }
        
        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background: #1e3a8a;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }
        
        .btn-submit:hover {
            background: #1e40af;
        }
        
        .password-help {
            text-align: center;
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #6b7280;
        }
        
        body.dark-mode .password-container {
            background: #1f2937;
        }
        
        body.dark-mode .password-box {
            background: #374151;
            color: white;
        }
        
        body.dark-mode .password-logo h2 {
            color: #60a5fa;
        }
    </style>
</head>
<body>
    <div class="password-container">
        <div class="password-box">
            <div class="password-logo">
                <h2><i class="fas fa-key"></i> Parol o'rnatish</h2>
                <p>ID: <strong>{{ user_id }}</strong></p>
            </div>
            
            {% with messages = get_flashed_messages() %}
                {% if messages %}
                    <div style="background: #fee2e2; color: #991b1b; padding: 1rem; border-radius: 4px; margin-bottom: 1rem;">
                        {{ messages[0] }}
                    </div>
                {% endif %}
            {% endwith %}
            
            <form method="POST">
                <input type="hidden" name="user_id" value="{{ user_id }}">
                
                <div class="form-group">
                    <label for="new_password">Yangi parol</label>
                    <input type="password" id="new_password" name="new_password" class="form-control" required>
                </div>
                
                <div class="form-group">
                    <label for="confirm_password">Parolni takrorlang</label>
                    <input type="password" id="confirm_password" name="confirm_password" class="form-control" required>
                </div>
                
                <button type="submit" class="btn-submit">Parolni o'rnatish</button>
            </form>
            
            <div class="password-help">
                <p>Parol kamida 6 ta belgidan iborat bo'lishi kerak</p>
                <p><a href="/login" style="color: #3b82f6;">Kirish sahifasiga qaytish</a></p>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        document.querySelector('form').addEventListener('submit', function(e) {
            const password = document.getElementById('new_password').value;
            const confirm = document.getElementById('confirm_password').value;
            
            if (password !== confirm) {
                e.preventDefault();
                alert('Parollar mos kelmadi!');
                return false;
            }
            
            if (password.length < 6) {
                e.preventDefault();
                alert('Parol kamida 6 ta belgidan iborat bo\'lishi kerak!');
                return false;
            }
        });
    </script>
</body>
</html>
